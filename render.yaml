services:
  - type: web
    name: kalchat
    runtime: node
    plan: free
    # Le site React est construit (frontend/dist) puis servi par le backend Express.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: STORY_LIFETIME_HOURS
        value: 24
      - key: DATABASE_URL
        sync: false
      # Kalia (IA de Kalchat) — API compatible OpenAI (Groq par défaut)
      - key: AI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
# Supabase sert uniquement de base de données (Postgres) et de stockage de fichiers.
# Les 3 variables DATABASE_URL, SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY restent à renseigner
# dans Render (Environment), comme pour la version actuelle. Aucune migration SQL à lancer :
# le backend crée et met à jour ses tables tout seul au démarrage.
