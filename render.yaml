services:
  - type: web
    name: kalchat
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: STORY_LIFETIME_HOURS
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
# Remarque : Kalchat utilise désormais Supabase (Postgres) comme base de données ET Supabase
# Storage pour les fichiers uploadés (photos, vidéos), et non plus SQLite ou le disque local
# de Render. Trois variables doivent être ajoutées manuellement dans le dashboard Render
# (Environment) : DATABASE_URL, SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY (Project Settings
# > API dans Supabase). Les données ET les fichiers sont désormais persistants et survivent
# aux redéploiements.
