name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour publier l'APK dans le dépôt (téléchargement depuis le site)
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier les secrets de signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Secrets KEYSTORE_BASE64 et/ou KEYSTORE_PASSWORD manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install

      - name: Ajouter les notifications push (si Firebase est configuré)
        run: |
          if [ -f google-services.json ]; then
            npm install @capacitor/push-notifications@^6.0.3
            echo "FIREBASE=1" >> "$GITHUB_ENV"
            echo "Firebase détecté : l'APK aura les notifications push."
          else
            echo "::warning::mobile/google-services.json est absent : l'APK est compilée SANS notifications push."
          fi

      - name: Créer le projet Android
        run: npx cap add android

      - name: Configurer Firebase et l'icône des notifications
        if: env.FIREBASE == '1'
        run: |
          cp google-services.json android/app/google-services.json
          mkdir -p android/app/src/main/res/drawable
          cp notification-icon.png android/app/src/main/res/drawable/ic_stat_kalchat.png

      - name: Générer les icônes et l'écran de démarrage
        run: npx capacitor-assets generate --android

      - name: Ajouter les autorisations (micro, caméra, médias)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          """
          s = s.replace("</manifest>", perms + "</manifest>")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Kalchat dans le menu Partager d'Android (texte, liens, photos, vidéos)
        run: |
          # Code Android de Kalchat (dossier mobile/android-src) : réception des partages + enregistrement du module
          JAVA_DIR="android/app/src/main/java/com/kalchat/app"
          test -d "$JAVA_DIR" || { echo "Dossier $JAVA_DIR introuvable"; exit 1; }
          cp android-src/ShareTargetPlugin.java android-src/MainActivity.java "$JAVA_DIR/"
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          def f(action, mime):
              return f"""
                  <intent-filter>
                      <action android:name="android.intent.action.{action}" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="{mime}" />
                  </intent-filter>
              """
          filters = f("SEND", "text/plain") + f("SEND", "image/*") + f("SEND", "video/*") + f("SEND_MULTIPLE", "image/*")
          assert "</activity>" in s
          s = s.replace("</activity>", filters + "</activity>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Ouvrir les liens kalchat.site dans l'appli (App Links)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          f = """
                  <intent-filter android:autoVerify="true">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="https" android:host="kalchat.site" />
                  </intent-filter>
              """
          assert "</activity>" in s
          s = s.replace("</activity>", f + "</activity>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Numéro de version (pour pouvoir mettre à jour par-dessus)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compiler l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > kalchat.jks
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 $UNSIGNED aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks kalchat.jks --ks-key-alias kalchat --ks-pass env:KS_PASS \
            --out Kalchat.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify Kalchat.apk
          rm kalchat.jks

      - name: Empreinte du certificat (à copier dans Render pour les liens kalchat.site)
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          FP=$($ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs Kalchat.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //')
          echo "Empreinte SHA-256 du certificat : $FP"
          {
            echo "### Empreinte SHA-256 du certificat de l'APK"
            echo
            echo "Variable à renseigner dans Render (Environment) : \`ANDROID_CERT_SHA256\`"
            echo
            echo "\`$FP\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Kalchat-APK
          path: mobile/Kalchat.apk
          retention-days: 30

      - name: Publier l'APK sur le site (page d'accueil, bouton « Télécharger l'APK »)
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p frontend/public/downloads
          cp mobile/Kalchat.apk frontend/public/downloads/Kalchat.apk
          SIZE=$(stat -c%s mobile/Kalchat.apk)
          printf '{"version":"1.0.%s","size":%s,"built_at":"%s","force":false}\n' "${{ github.run_number }}" "$SIZE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > frontend/public/downloads/latest.json
          git config user.name "kalchat-bot"
          git config user.email "kalchat-bot@users.noreply.github.com"
          git add frontend/public/downloads
          git commit -m "APK Kalchat 1.0.${{ github.run_number }}" || exit 0
          # La compilation modifie des fichiers suivis par git (ex. mobile/package.json) : on les remet à l'état du dépôt,
          # sinon « git pull --rebase » refuse de s'exécuter (« You have unstaged changes »).
          git checkout -- .
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
