name: Build APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier les secrets de signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Secrets KEYSTORE_BASE64 et/ou KEYSTORE_PASSWORD manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes et l'écran de démarrage
        run: npx capacitor-assets generate --android

      - name: Ajouter les autorisations (micro, caméra, médias)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          """
          s = s.replace("</manifest>", perms + "</manifest>")
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Numéro de version (pour pouvoir mettre à jour par-dessus)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Compiler l'APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > kalchat.jks
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $ANDROID_HOME/build-tools/$BT/zipalign -p -f 4 $UNSIGNED aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks kalchat.jks --ks-key-alias kalchat --ks-pass env:KS_PASS \
            --out Kalchat.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner verify Kalchat.apk
          rm kalchat.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Kalchat-APK
          path: mobile/Kalchat.apk
          retention-days: 30
